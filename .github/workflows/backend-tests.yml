name: Backend tests

on:
  pull_request:
    paths:
      - 'backend/**'
      - '.github/workflows/backend-tests.yml'
  push:
    branches: [main]
    paths:
      - 'backend/**'
      - '.github/workflows/backend-tests.yml'

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # Both ends of the supported range: 18 is the floor package.json
        # declares, and the test runner differs enough between majors that
        # only running the newer one hid a broken `npm test` on 18.
        node-version: ['18', '22']
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci
      # The suite needs no database or secrets: it stubs the model methods it
      # touches and src/config/* gets placeholders from tests/setupEnv.ts.
      - run: npm run typecheck
      - run: npm test
